<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 20 - File de notifications</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="carte">
        <h1>File de notifications</h1>
        <p class="intro">Trois notifications visibles au maximum, les autres attendent leur tour.</p>

        <div class="boutons">
            <button type="button" data-type="succes">Succès</button>
            <button type="button" data-type="erreur">Erreur</button>
            <button type="button" data-type="info">Info</button>
        </div>

        <p class="aide">Survole une notification pour mettre la fermeture en pause.</p>
    </main>

    <div id="toasts"></div>
    <p id="attente"></p>

    <script src="script.js"></script>
</body>
</html>
