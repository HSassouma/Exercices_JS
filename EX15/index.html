<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 15 - Kanban</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="carte">
        <h1>Kanban</h1>
        <p class="intro">Déplace les cartes avec les flèches. En cours accepte 3 cartes au maximum.</p>

        <form id="form">
            <input id="titre" type="text" placeholder="Nouvelle carte" autocomplete="off">
            <button type="submit">Ajouter</button>
        </form>

        <div id="tableau" class="tableau">
            <section data-statut="afaire">
                <h2>À faire <span class="compteur">0</span></h2>
                <ul></ul>
            </section>

            <section data-statut="encours">
                <h2>En cours <span class="compteur">0</span></h2>
                <ul></ul>
            </section>

            <section data-statut="fait">
                <h2>Fait <span class="compteur">0</span></h2>
                <ul></ul>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
